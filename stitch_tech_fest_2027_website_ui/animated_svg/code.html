<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_34 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_34" style="display:block;"><svg class="select-none" height="100%" viewbox="0 0 400 400" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseRing {
        0% { r: 50px; opacity: 0.9; stroke-width: 3px; }
        50% { opacity: 0.4; stroke-width: 1.5px; }
        100% { r: 175px; opacity: 0; stroke-width: 0.5px; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @keyframes blinkBeacon {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.2; }
      }
      @keyframes dashRotate {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 240; }
      }
      .sweep-arm {
        transform-origin: 200px 200px;
        animation: radarSweep 4s linear infinite;
      }
      .wave-1 {
        transform-origin: 200px 200px;
        animation: pulseRing 3s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }
      .wave-2 {
        transform-origin: 200px 200px;
        animation: pulseRing 3s cubic-bezier(0.2, 0.8, 0.4, 1) infinite 1.5s;
      }
      .badge-glow {
        transform-origin: 200px 200px;
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
      .beacon {
        animation: blinkBeacon 1s steps(1) infinite;
      }
      .dashed-ring {
        transform-origin: 200px 200px;
        animation: dashRotate 20s linear infinite;
      }
    </style>
<lineargradient id="sweepGradient" x1="0" x2="1" y1="0" y2="1">
<stop offset="0%" stop-color="#c90016" stop-opacity="0.65"></stop>
<stop offset="60%" stop-color="#c90016" stop-opacity="0.1"></stop>
<stop offset="100%" stop-color="#c90016" stop-opacity="0"></stop>
</lineargradient>
<radialgradient cx="50%" cy="50%" id="centerGlow" r="50%">
<stop offset="0%" stop-color="#c90016" stop-opacity="0.9"></stop>
<stop offset="70%" stop-color="#c90016" stop-opacity="0.3"></stop>
<stop offset="100%" stop-color="#c90016" stop-opacity="0"></stop>
</radialgradient>
</defs>
<!-- Dark Technical Base Circle -->
<circle cx="200" cy="200" fill="#121214" r="190" stroke="#c90016" stroke-opacity="0.4" stroke-width="2"></circle>
<!-- Outer Monospace Coordinate Ring -->
<circle cx="200" cy="200" fill="none" r="175" stroke="#2e2e33" stroke-width="1.5"></circle>
<circle class="dashed-ring" cx="200" cy="200" fill="none" opacity="0.6" r="150" stroke="#c90016" stroke-dasharray="6 6" stroke-width="1.5"></circle>
<!-- Expanding Radar Pulse Waves -->
<circle class="wave-1" cx="200" cy="200" fill="none" r="50" stroke="#c90016"></circle>
<circle class="wave-2" cx="200" cy="200" fill="none" r="50" stroke="#c90016"></circle>
<!-- Radar Sweep Arm -->
<g class="sweep-arm">
<path d="M 200 200 L 200 25 A 175 175 0 0 1 324 76 Z" fill="url(#sweepGradient)"></path>
<line opacity="0.85" stroke="#ffffff" stroke-width="2" x1="200" x2="200" y1="200" y2="25"></line>
</g>
<!-- Technical Axis Crosshairs -->
<line stroke="#333338" stroke-dasharray="4 8" stroke-width="1" x1="30" x2="370" y1="200" y2="200"></line>
<line stroke="#333338" stroke-dasharray="4 8" stroke-width="1" x1="200" x2="200" y1="30" y2="370"></line>
<!-- Target Cardinal Notches -->
<line stroke="#c90016" stroke-width="3" x1="200" x2="200" y1="15" y2="30"></line>
<line stroke="#c90016" stroke-width="3" x1="200" x2="200" y1="370" y2="385"></line>
<line stroke="#c90016" stroke-width="3" x1="15" x2="30" y1="200" y2="200"></line>
<line stroke="#c90016" stroke-width="3" x1="370" x2="385" y1="200" y2="200"></line>
<!-- Pulsing Center Core -->
<circle class="badge-glow" cx="200" cy="200" fill="url(#centerGlow)" r="45"></circle>
<circle cx="200" cy="200" fill="#c90016" r="28" stroke="#ffffff" stroke-width="2.5"></circle>
<!-- Active Live Beacon Dot -->
<circle class="beacon" cx="200" cy="200" fill="#ffffff" r="8"></circle>
<!-- Monospace Telemetry Labels -->
<text fill="#ff4d5a" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="3" text-anchor="middle" x="200" y="115">T-MINUS 2027</text>
<text fill="#e0ded8" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="2" text-anchor="middle" x="200" y="295">ARENA TELEMETRY // ACTIVE</text>
</svg></div><!-- STITCH_SVG_END:ANIMATION_34 -->
</body>
</html>
