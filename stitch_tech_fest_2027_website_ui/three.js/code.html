<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_33 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_33" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_33');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || 500;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
camera.position.z = 24;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const group = new THREE.Group();
scene.add(group);

// 1. Kinetic Octagon Wireframe Cage (Symbolizing Hardware Combat Arena)
const octagonPoints = [];
const segments = 8;
const radius = 9;
for (let i = 0; i <= segments; i++) {
  const theta = (i / segments) * Math.PI * 2;
  octagonPoints.push(new THREE.Vector3(Math.cos(theta) * radius, Math.sin(theta) * radius, 0));
}
const octagonGeo = new THREE.BufferGeometry().setFromPoints(octagonPoints);
const octagonMat = new THREE.LineBasicMaterial({ color: 0xc90016, linewidth: 2, transparent: true, opacity: 0.85 });
const octagonLine = new THREE.Line(octagonGeo, octagonMat);
group.add(octagonLine);

// Outer concentric telemetry ring
const outerRingGeo = new THREE.RingGeometry(11, 11.2, 32);
const outerRingMat = new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.DoubleSide, transparent: true, opacity: 0.35, wireframe: true });
const outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
group.add(outerRing);

// 2. Central Core: High-Tech Geometric Polyhedron
const coreGeo = new THREE.IcosahedronGeometry(4.5, 1);
const coreMat = new THREE.MeshPhongMaterial({
  color: 0xc90016,
  emissive: 0x3d0006,
  wireframe: true,
  transparent: true,
  opacity: 0.75
});
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
group.add(coreMesh);

// Solid inner crimson pulse nucleus
const nucleusGeo = new THREE.OctahedronGeometry(2.2, 0);
const nucleusMat = new THREE.MeshLambertMaterial({
  color: 0xc90016,
  emissive: 0x88000f
});
const nucleusMesh = new THREE.Mesh(nucleusGeo, nucleusMat);
group.add(nucleusMesh);

// 3. Cyber Data Nodes (Orbiting Particle Cloud)
const particleCount = 200;
const particleGeo = new THREE.BufferGeometry();
const particlePos = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount * 3; i += 3) {
  const u = Math.random();
  const v = Math.random();
  const theta = u * 2.0 * Math.PI;
  const phi = Math.acos(2.0 * v - 1.0);
  const r = 12 + Math.random() * 5;
  particlePos[i] = r * Math.sin(phi) * Math.cos(theta);
  particlePos[i+1] = r * Math.sin(phi) * Math.sin(theta);
  particlePos[i+2] = r * Math.cos(phi);
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
const particleMat = new THREE.PointsMaterial({
  color: 0xc90016,
  size: 0.35,
  transparent: true,
  opacity: 0.65
});
const particleSystem = new THREE.Points(particleGeo, particleMat);
group.add(particleSystem);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0xff2233, 2, 50);
pointLight.position.set(10, 15, 15);
scene.add(pointLight);

// Interactive mouse responsiveness
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

function onMouseMove(event) {
  const rect = container.getBoundingClientRect();
  mouseX = ((event.clientX - rect.left) / (rect.width || 1)) * 2 - 1;
  mouseY = -(((event.clientY - rect.top) / (rect.height || 1)) * 2 - 1);
}
window.addEventListener('mousemove', onMouseMove);

function onResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || 500;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

// Animation render loop
let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  targetX += (mouseX - targetX) * 0.05;
  targetY += (mouseY - targetY) * 0.05;

  group.rotation.y = elapsedTime * 0.25 + targetX * 0.8;
  group.rotation.x = Math.sin(elapsedTime * 0.2) * 0.15 - targetY * 0.5;

  coreMesh.rotation.y -= 0.01;
  coreMesh.rotation.z += 0.005;

  const pulse = 1.0 + Math.sin(elapsedTime * 3.5) * 0.12;
  nucleusMesh.scale.set(pulse, pulse, pulse);

  particleSystem.rotation.y = -elapsedTime * 0.08;

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_33 -->
</body>
</html>
